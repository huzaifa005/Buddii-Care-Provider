# Netlify test deploy of the Provider Portal (frontend only, mock demo data).
# Netlify detects Next.js and applies its Next.js runtime automatically.
[build]
  command = "node scripts/netlify-demo-build.mjs"

[build.environment]
  NODE_VERSION = "24"
  # Demo data only. Set to "disabled" and point NEXT_PUBLIC_API_URL at the Django API for a real deploy.
  NEXT_PUBLIC_API_MOCKING = "enabled"
  NEXT_PUBLIC_API_URL = "/api/v1"

[[plugins]]
  package = "@netlify/plugin-nextjs"
